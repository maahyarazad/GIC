name: Deploy German Industry Club App

on:
  workflow_dispatch:

# Prevent two deploys from running over each other
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Build (Vite) & deploy static client
  # ─────────────────────────────────────────────
  deploy-client:
    name: Build & Deploy Client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        # No package-lock.json is committed (it's in .gitignore), so `npm ci` can't be used.
        run: npm install --no-audit --no-fund

      - name: Build client
        run: npm run build
        # If your Vite app needs build-time variables, add them here, e.g.:
        # env:
        #   VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}   # read by `sshpass -e`, never on the command line
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          REMOTE_DIR: german-industry-club/node/german-industry-club.com/dist   # relative to the SSH user's home
        run: |
          set -euo pipefail
          SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new"

          # Make sure the target exists
          sshpass -e $SSH "$SSH_TARGET" "mkdir -p '$REMOTE_DIR'"

          # Sync the build; --delete removes stale files, so no separate "clear" step
          sshpass -e rsync -avz --delete -e "$SSH" dist/ "$SSH_TARGET:$REMOTE_DIR/"

          # Verify
          sshpass -e $SSH "$SSH_TARGET" "ls -la '$REMOTE_DIR'"